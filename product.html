                    .product-carousel { display: flex; align-items: center; gap: 12px; }
                    .product-carousel .products-grid {

                    }
                    .product-carousel .products-grid::-webkit-scrollbar { display: none; }
                    .product-carousel .product-card { flex: 0 0 260px; scroll-snap-align: start; }
                    .carousel-arrow { flex: 0 0 auto; cursor: pointer; padding: 10px 14px; font-size: 20px; }
                    @media (max-width: 600px) {
                        .product-carousel { gap: 6px; }
                        .product-carousel .product-card { flex-basis: 80%; }
                    }
                </style>
